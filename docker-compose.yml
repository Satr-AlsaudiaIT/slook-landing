# Local / VPS deployment helper.
#   docker compose up -d          → start in background
#   docker compose logs -f slook  → tail logs
#   docker compose down           → stop
#
# The DB is persisted to ./data on the host, so SQLite survives restarts.

services:
  slook:
    build:
      context: .
      dockerfile: Dockerfile
    image: slook-landing:latest
    container_name: slook-landing
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
    env_file:
      - .env.local
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
